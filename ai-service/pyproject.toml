[project]
name = "commercial-ops-ai-service"
version = "0.1.0"
description = "Python AI service for Commercial Operations AI: provider layer, tool-using shopping agent (LangGraph), FastAPI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Added when the RAG phase starts (dry-run resolved together with langgraph, not yet used):
rag = ["llama-index-core>=0.14", "ragas>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
